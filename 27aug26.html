```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Car Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
}

/* Sky */
.sky {
    width: 100%;
    height: 70vh;
    position: relative;
    background: linear-gradient(#4db8ff, #bfeeff);
}

/* Sun */
.sun {
    position: absolute;
    width: 90px;
    height: 90px;
    background: #ffd93d;
    border-radius: 50%;
    top: 50px;
    right: 100px;
    box-shadow: 0 0 40px #fff000;
}

/* Clouds */
.cloud {
    position: absolute;
    background: white;
    width: 120px;
    height: 40px;
    border-radius: 40px;
    opacity: 0.9;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    bottom: 10px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    bottom: 5px;
}

.cloud1 {
    top: 100px;
    left: 15%;
}

.cloud2 {
    top: 180px;
    left: 55%;
}

/* Road */
.road {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 30vh;
    background: #444;
    border-top: 8px solid #777;
}

/* Road lines */
.road-line {
    position: absolute;
    top: 50%;
    width: 100%;
    height: 10px;
    background: repeating-linear-gradient(
        to right,
        white 0px,
        white 100px,
        transparent 100px,
        transparent 180px
    );
    animation: roadMove 0.7s linear infinite;
}

@keyframes roadMove {
    from {
        background-position: 0;
    }
    to {
        background-position: -180px;
    }
}

/* Car */
.car {
    position: absolute;
    width: 300px;
    height: 130px;
    left: 50%;
    bottom: 13vh;
    transform: translateX(-50%);
}

/* Car body */
.car-body {
    position: absolute;
    width: 300px;
    height: 75px;
    bottom: 20px;
    background: #e63946;
    border-radius: 35px 45px 15px 15px;
    box-shadow: 0 8px 5px rgba(0,0,0,0.3);
}

/* Upper car */
.car-top {
    position: absolute;
    width: 170px;
    height: 70px;
    left: 65px;
    bottom: 80px;
    background: #e63946;
    border-radius: 80px 80px 5px 5px;
}

/* Windows */
.window {
    position: absolute;
    background: #aee8ff;
    border: 4px solid #333;
    top: 10px;
    width: 65px;
    height: 45px;
}

.window1 {
    left: 15px;
    border-radius: 45px 5px 5px 5px;
}

.window2 {
    right: 15px;
    border-radius: 5px 45px 5px 5px;
}

/* Headlight */
.headlight {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    right: 8px;
    top: 25px;
    box-shadow: 0 0 20px yellow;
}

/* Tail light */
.taillight {
    position: absolute;
    width: 15px;
    height: 20px;
    background: #ff0000;
    left: 5px;
    top: 25px;
    border-radius: 5px;
}

/* Wheels */
.wheel {
    position: absolute;
    width: 65px;
    height: 65px;
    bottom: 0;
    background: #111;
    border-radius: 50%;
    border: 8px solid #222;
    animation: wheelSpin 0.3s linear infinite;
}

.wheel::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 25px;
    background: #aaa;
    border-radius: 50%;
    left: 12px;
    top: 12px;
}

.wheel1 {
    left: 35px;
}

.wheel2 {
    right: 35px;
}

@keyframes wheelSpin {
    to {
        transform: rotate(360deg);
    }
}

/* Buttons */
.controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
}

button {
    padding: 12px 22px;
    margin-right: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.start {
    background: #20c997;
    color: white;
}

.stop {
    background: #dc3545;
    color: white;
}

button:hover {
    transform: scale(1.05);
}

/* Moving car */
.car.running {
    animation: carMove 4s linear infinite;
}

@keyframes carMove {
    0% {
        left: -350px;
    }

    100% {
        left: calc(100% + 350px);
    }
}
</style>
</head>

<body>

<div class="sky">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="road">
        <div class="road-line"></div>
    </div>

    <div class="car" id="car">

        <div class="car-top">
            <div class="window window1"></div>
            <div class="window window2"></div>
        </div>

        <div class="car-body">
            <div class="headlight"></div>
            <div class="taillight"></div>
        </div>

        <div class="wheel wheel1"></div>
        <div class="wheel wheel2"></div>

    </div>

</div>

<div class="controls">
    <button class="start" onclick="startCar()">▶ Start</button>
    <button class="stop" onclick="stopCar()">⏹ Stop</button>
</div>

<script>
const car = document.getElementById("car");

function startCar() {
    car.classList.add("running");
}

function stopCar() {
    car.classList.remove("running");
}
</script>

</body>
</html>
